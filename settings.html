<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dialogue — Settings</title><link rel="stylesheet" href="css/dialogue.css"><link rel="stylesheet" href="css/local-functional.css"><link rel="stylesheet" href="css/review-shared.css"></head>
<body class="updated-ui">
  <div class="app-shell"><aside class="sidebar">
    <div class="brand"><a href="projects.html" aria-label="Dialogue projects"><svg class="icon" aria-hidden="true"><use href="assets/review-icons.svg#mark"></use></svg></a></div>
    <nav class="side-nav" aria-label="Main navigation">
      <a class="side-link" href="projects.html"><img class="side-nav-icon" src="assets/project-icon-default.svg" alt=""> <span>Projects</span></a>
      <a class="side-link" href="design-systems.html"><img class="side-nav-icon" src="assets/ds-icon-default.svg" alt=""> <span>Design systems</span></a>
      <a class="side-link active" aria-current="page" href="settings.html"><img class="side-nav-icon" src="assets/settings-icon-selected.svg" alt=""> <span>Settings</span></a>
    </nav>
    <div class="profile-link"><span class="profile-inner"><span class="avatar">D</span><span class="profile-copy"><strong>Local workspace</strong><span>This device</span></span></span></div>
  </aside>
  <main class="main"><header class="page-head"><h1 class="page-title">Settings</h1></header><div class="page-surface">
    <section class="settings-group agent-section"><h2>AI model</h2><div data-agent-settings></div></section>
    <form class="settings-group grid-settings" data-grid-settings><h2>Grid</h2>
      <label class="settings-row"><span>Grid colour</span><span class="grid-color-field"><input type="color" name="gridColor" value="#bae6ff" aria-label="Grid colour"><output data-grid-color-label>#BAE6FF</output></span></label>
      <label class="settings-row"><span>Grid point size</span><span class="grid-size-field"><input name="gridSize" type="number" min="2" max="64" step="1" required value="8" aria-label="Grid point size"><span aria-hidden="true">pt</span></span></label>
      <label class="settings-row"><span>Grid opacity</span><select name="gridOpacity" aria-label="Grid opacity"><option value="0">0%</option><option value="10">10%</option><option value="20">20%</option><option value="30">30%</option><option value="40">40%</option><option value="50" selected>50%</option><option value="60">60%</option><option value="70">70%</option><option value="80">80%</option><option value="90">90%</option><option value="100">100%</option></select></label>
      <p class="settings-note" data-settings-status role="status">Grid preferences are saved in this browser.</p>
    </form>
    <section class="settings-group planned-settings"><h2>Notifications<span class="planned-label">Planned</span></h2><div class="settings-row"><span>Prototype updates</span><button class="placeholder-toggle" type="button" disabled aria-label="Prototype update notifications are planned" title="Not available yet"></button></div></section>
    <section class="settings-group planned-settings"><h2>Security and access<span class="planned-label">Planned</span></h2><div class="settings-row"><span>Users and teams</span><button class="placeholder-toggle" type="button" disabled aria-label="Users and teams settings are planned" title="Not available yet"></button></div></section>
  </div></main></div>
  <script src="js/dialogue.js"></script><script src="js/agent-connect.js"></script>
</body></html>
