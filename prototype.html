<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dialogue — Prototype</title>
  <link rel="stylesheet" href="css/dialogue.css">
  <link rel="stylesheet" href="css/local-functional.css">
</head>
<body class="viewer">
  <header class="viewer-bar">
    <nav class="viewer-crumb" aria-label="Breadcrumb">
      <a class="crumb-link" href="projects.html">Projects</a>
      <svg class="crumb-arrow" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M2.5 10H15.25M10.75 5.5L15.25 10L10.75 14.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter"/></svg>
      <a class="crumb-link" href="project-landline.html" data-project-link><span data-project-title>Landline</span></a>
      <svg class="crumb-arrow" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M2.5 10H15.25M10.75 5.5L15.25 10L10.75 14.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter"/></svg>
      <span class="crumb-current" data-prototype-title>Prototype</span>
    </nav>
    <div class="viewer-title" data-prototype-title>Prototype</div>
    <button class="pill viewer-share" type="button" data-share-open aria-haspopup="dialog" aria-controls="share-modal">Share</button>
  </header>

  <main class="viewer-stage">
    <div class="prototype-frame-shell" data-prototype-frame-shell hidden>
      <iframe class="prototype-live-frame" data-prototype-frame sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads" referrerpolicy="no-referrer"></iframe>
    </div>
    <div class="prototype-load-state" data-prototype-state>Loading prototype…</div>
  </main>
  <button class="viewer-restart" type="button" data-restart>↻ &nbsp; Restart <span class="key">R</span></button>

  <div class="share-modal-layer" data-share-layer hidden>
    <section class="share-modal" id="share-modal" role="dialog" aria-modal="true" aria-labelledby="share-modal-title">
      <button class="share-modal-close" type="button" aria-label="Close share dialog" data-share-close>×</button>
      <h2 id="share-modal-title">Share this prototype</h2>
      <div class="share-link-row">
        <span class="share-link-label">Local functional build — public sharing not connected yet</span>
        <button class="share-copy-button" type="button" data-share-copy>Copy</button>
      </div>
      <label class="share-project-access">
        <span>Allow access to all prototypes in the project</span>
        <input type="checkbox" data-share-project-access aria-label="Allow access to all prototypes in the project">
      </label>
    </section>
  </div>

  <script src="js/dialogue.js"></script>
  <script src="js/prototype-viewer.js"></script>
</body>
</html>
