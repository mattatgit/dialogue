<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dialogue — Workspace</title>
  <link rel="stylesheet" href="css/dialogue.css">
  <link rel="stylesheet" href="css/review-shared.css">
  <link rel="stylesheet" href="css/prototype-review.css">
  <link rel="stylesheet" href="js/vendor/xterm.css">
  <link rel="stylesheet" href="css/terminal.css">
</head>
<body class="review-view workspace-review" data-mode="test">
  <header class="review-header">
    <a class="review-home hover-small" href="projects.html" aria-label="Dialogue projects"><svg class="icon"><use href="assets/review-icons.svg#mark"/></svg></a>
    <nav class="review-crumb" aria-label="Breadcrumb">
      <a href="projects.html">Projects</a><span aria-hidden="true">→</span>
      <a href="projects.html" data-project-link data-project-title>Project</a><span aria-hidden="true">→</span>
      <span data-ref-title data-review-title>Workspace</span>
    </nav>
    <div class="review-mode-switch" role="group" aria-label="Workspace mode">
      <button type="button" data-mode-button="test" aria-pressed="true"><span class="mode-icon interact-icon" aria-hidden="true"><img class="mode-icon-inactive" src="assets/interact-grey.svg" alt=""><img class="mode-icon-active" src="assets/interact-white.svg" alt=""></span>Interact</button>
      <button type="button" data-mode-button="comment" aria-pressed="false"><span class="mode-icon comment-icon" aria-hidden="true"><img class="mode-icon-inactive" src="assets/comment-grey.svg" alt=""><img class="mode-icon-active" src="assets/comment-white.svg" alt=""></span>Comment</button>
      <button type="button" data-mode-button="terminal" aria-pressed="false" disabled><span class="mode-icon terminal-icon" aria-hidden="true"><img class="mode-icon-inactive" src="assets/terminal-grey.svg" alt=""><img class="mode-icon-active" src="assets/terminal-white.svg" alt=""></span>LLM terminal</button>
    </div>
    <div class="review-top-actions">
      <span class="workspace-status" data-workspace-status hidden></span>
      <button class="review-button" data-reload data-restart type="button" title="Restart prototype (R)" aria-label="Restart prototype"><svg class="icon reload-icon"><use href="assets/review-icons.svg#reload"/></svg><span>Restart</span></button>
      <button class="review-button" data-review-share type="button" aria-haspopup="dialog"><svg class="icon"><use href="assets/review-icons.svg#share"/></svg>Share</button>
    </div>
  </header>
  <aside class="review-history" aria-label="Branch activity" tabindex="0" hidden>
    <div data-history-items></div><div class="history-spacer" aria-hidden="true"></div>
  </aside>
  <section class="terminal-pane" id="workspace-terminal" data-terminal-pane hidden aria-label="Agent terminal">
    <div class="terminal-toolbar" aria-label="Agent session"><span class="terminal-toolbar-mark" aria-hidden="true">π</span><span class="terminal-toolbar-model" data-terminal-model title="Selected agent model">AI model</span><span class="terminal-toolbar-ref" data-ref-title title="Current branch"></span></div>
    <div class="terminal-host" data-terminal-host></div>
    <div class="terminal-overlay" data-terminal-overlay hidden><span class="terminal-overlay-text" data-terminal-overlay-text>Connecting…</span></div>
  </section>
  <main class="review-canvas" aria-label="Prototype canvas" data-workspace-body>
    <div class="review-scroll"><div class="review-plane">
      <div class="review-frame-host" data-prototype-frame-shell hidden><iframe title="Prototype" data-review-frame data-prototype-frame sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-downloads" referrerpolicy="no-referrer"></iframe></div>
      <div class="review-grid" aria-hidden="true" hidden></div>
      <div class="review-hit-layer" aria-label="Draw an annotation" hidden></div>
      <svg class="review-annotations" aria-hidden="true"><defs><marker id="annotation-arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="currentColor" stroke-width="1.4"/></marker></defs><rect data-selection-rect hidden/><line data-selection-arrow marker-end="url(#annotation-arrowhead)" hidden/></svg>
    </div></div>
    <button class="grid-toggle hover-small" type="button" data-grid-toggle aria-label="Show grid" aria-pressed="false" title="Show grid"><svg class="icon"><use href="assets/review-icons.svg#grid"/></svg></button>
    <div class="review-load-state" role="status" data-load-state data-prototype-state>Loading workspace…</div>
    <form class="review-composer" aria-label="Prototype comment" data-comment-form data-state="default" hidden>
      <div class="composer-heading"><span class="anchor-tag" data-anchor-label>Area</span><button type="button" class="composer-close" aria-label="Close comment" data-close-comment><span class="composer-close-icon" aria-hidden="true"><img class="close-icon-default" src="assets/comment-close-default.svg" alt=""><img class="close-icon-active" src="assets/comment-close-active.svg" alt=""></span></button></div>
      <label class="sr-only" for="review-comment">Add your comment</label>
      <textarea id="review-comment" name="feedback" maxlength="4000" placeholder="Add your comment" rows="3"></textarea>
      <div class="composer-figma-chip" data-comment-figma-chip hidden><img src="assets/figma-icon.svg" alt=""><span data-comment-figma-label>Figma design</span><button type="button" data-comment-figma-remove aria-label="Remove Figma design"><img src="assets/create-chip-close.svg" alt=""></button></div>
      <div class="composer-footer"><small data-composer-status>Sent to the connected agent</small><button class="composer-send" type="submit" aria-label="Send comment" disabled><span class="composer-send-label">Send</span><span class="composer-enter-icon" aria-hidden="true"><img class="enter-icon-default" src="assets/comment-enter-default.svg" alt=""><img class="enter-icon-active" src="assets/comment-enter-active.svg" alt=""></span></button></div>
    </form>
    <div class="review-tools" role="group" aria-label="Comment tools" hidden>
      <button type="button" data-tool="selection" aria-pressed="false" disabled title="Element inspection is not available for this live preview"><svg class="icon"><use href="assets/review-icons.svg#select"/></svg>Select</button>
      <button type="button" data-tool="area" aria-pressed="true"><svg class="icon"><use href="assets/review-icons.svg#area"/></svg>Area</button>
      <button type="button" data-tool="arrow" aria-pressed="false"><svg class="icon"><use href="assets/review-icons.svg#arrow"/></svg>Arrow</button>
    </div>
  </main>
  <div class="review-toast" role="status" aria-live="polite" hidden></div>
  <dialog class="review-share-dialog" aria-labelledby="review-share-title">
    <button class="dialog-close" type="button" aria-label="Close share dialog"><img src="assets/share-modal-close.svg" alt="" aria-hidden="true"></button>
    <h1 id="review-share-title">Share this prototype</h1>
    <div class="review-share-row"><input readonly aria-label="Local workspace link" data-share-url><button class="review-share-copy" type="button" data-copy-local>Copy</button></div>
    <label class="review-share-option"><span>Public sharing is not connected yet</span><span class="review-share-checkbox"><input type="checkbox" disabled aria-label="Allow access to all prototypes in the project"><span aria-hidden="true"></span></span></label>
  </dialog>
  <script src="js/vendor/xterm.js"></script>
  <script src="js/vendor/xterm-addon-fit.js"></script>
  <script src="js/terminal.js"></script>
  <script src="js/connect-panel.js"></script>
  <script src="js/workspace.js"></script>
  <script type="module" src="js/prototype-review.mjs"></script>
</body>
</html>
